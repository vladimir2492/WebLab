    ### Did you know? A few facts behind the table
    - **It was Titanic's first voyage.** The ship left Southampton on 10 April 1912, heading for New York. It stopped at Cherbourg and Queenstown—the places behind our `embarked` codes.
    - **The sinking took about 2 hours and 40 minutes after the collision.** Titanic hit the iceberg at about 11:40 p.m. on 14 April and sank at about 2:20 a.m. on 15 April.
    - **There were 20 lifeboats.** Their total capacity was about 1,178 people, while about 2,200 passengers and crew were aboard. Our passenger table does not include the crew.
    - **Titanic also carried mail.** The letters RMS stand for “Royal Mail Ship.”
    - **The wreck was found in 1985.** That was 73 years after the sinking, about 2.5 miles below the ocean surface.

    Historical source: [Royal Museums Greenwich](https://www.rmg.co.uk/stories/maritime-history/rms-titanic-facts).

    **Think about it:** our table has ages, fares, and classes—but no column for where each person was when the iceberg was hit. What other missing details might matter? A table can tell us a lot without telling us the whole story.

  <script id="20" type="text/markdown">
    ### What do the fields mean?
    A **field** is a column in the table, such as `age`. A **value** is what you find in one cell, such as `29`.
    A **feature** is a detail we give to the model to help it make a guess. The **target** is the answer we want it to guess: `survived`.

    | Field | Simple meaning | Example value and what it means | Use in our lesson |
    |---|---|---|---|
    | `pclass` | The passenger's ticket class | `1` = first class; `2` = second class; `3` = third class | Compare the three groups; use as a model input |
    | `survived` | Whether the passenger survived the sinking | `1` = survived; `0` = did not survive | The answer we check our predictions against; do not give it to the model as an input |
    | `name` | The passenger's name, as written in the record | `Allen, Miss. Elisabeth Walton` = Elisabeth Walton Allen | Find a person in the table; we do not use names to train this model |
    | `sex` | The sex recorded for the passenger | `female` or `male` | Compare groups; use as a model input |
    | `age` | How old the passenger was, in years | `29` = 29 years old; `0.92` = about 11 months old | Compare age groups; use as a model input. A blank means the age is unknown |
    | `sibsp` | How many brothers, sisters, husbands, or wives the passenger had on the ship | `0` = none recorded; `1` = one sibling or spouse. It does not tell us which one | Explore family size. Do not count the passenger themselves |
    | `parch` | How many parents or children the passenger had on the ship | `2` = two parents or children in total; for a baby, this can mean both parents | Explore family size. It does not count siblings or spouses |
    | `ticket` | The code or number on the ticket | `113781` = a ticket identifier shared by several Allison family records | Connect people with the same ticket. A larger ticket number does not mean a better ticket |
    | `fare` | The ticket price recorded in British pounds | `151.5500` = a recorded fare of £151.55 | Compare recorded prices. People sharing a ticket can have the same fare value |
    | `cabin` | The room number or room numbers in the record | `B5` = cabin B5; `C22 C26` lists two cabins | Explore cabin information. Many rows have no cabin value |
    | `embarked` | The port where the passenger got on the ship | `S` = Southampton; `C` = Cherbourg; `Q` = Queenstown | Compare passengers who boarded at different ports |
    | `boat` | The lifeboat number or code in the record | `2` = lifeboat 2; `11` = lifeboat 11 | Do not use it to predict: this detail comes from the rescue, after the sinking began |
    | `body` | The identification number given to a recovered body | `135` = body identification number 135. It is not a count or an age. A blank means no body ID is recorded | Do not use it to predict: it gives information learned after the disaster |
    | `home.dest` | The person's recorded home or travel destination | `St Louis, MO` = St Louis, Missouri; `Montreal, PQ / Chesterville, ON` lists two places | Read more about a passenger's journey; not an input in our small model |

    ### Read one real passenger row
    Elisabeth Walton Allen has `pclass = 1`, `age = 29`, `sibsp = 0`, `parch = 0`, and `survived = 1`.
    In plain English: she was 29, travelled in first class, and survived. This table lists no siblings, spouse, parents, or children travelling with her. That does **not** prove she travelled without friends or other people she knew.

    ### Three details that are easy to misunderstand
    - **Blank is not zero.** A blank age means “we do not know.” `sibsp = 0` means no siblings or spouse are recorded on the ship.
    - **A number can be a label.** Ticket `113781` identifies a ticket. Adding ticket numbers together would not tell us anything useful about passengers.
    - **Some fields already reveal the answer.** Imagine predicting a test score while looking at the answer sheet. Using `survived`, `boat`, or `body` as prediction inputs creates a similar problem.

    **Try it:** explain `pclass = 3`, `age = 2`, and `parch = 2` in your own words. Can you tell whether this passenger survived from those three details alone?

    ## 3. Group fields to find patterns
    Group passengers by one field, count the people, and count survivors.
    **Why a rate?** A larger group can have more survivors simply because it has more people.

  <script id="6" type="module" pinned>
    function summarize(rows, key) {
      return Array.from(d3.group(rows, key), ([group, members]) => {
        const survivors = d3.sum(members, p => p.survived);
        return {group, passengers: members.length, survivors,
          "survival (%)": Math.round(1000 * survivors / members.length) / 10};
      });
    }
    const groupField = view(Inputs.select(["pclass", "sex", "embarked"], {label: "Group by", value: "pclass"}));
  </script>

  <script id="11" type="text/markdown">
    ## 5. Write a manual prediction rule
    Our starting rule: **first class OR younger than 16 → predict survival. Otherwise → predict non-survival.**
    Use the slider above to explore the age threshold. A missing age does not satisfy the age condition.
    Before looking at accuracy, make your own estimate. What kind of mistakes do you expect?
    **Checkpoint:** explain OR in plain language. Would a 40-year-old first-class passenger qualify? Would a 10-year-old third-class passenger qualify? Would a 16-year-old third-class passenger qualify?
  </script>
  <script id="12" type="module" pinned>
    function predictSurvival(p) {
      const firstClass = p.pclass === 1;
      const child = p.age != null && p.age < ageCutoff;
      return firstClass || child ? 1 : 0;
    }
    const predictions = passengers.map(p => ({...p, predicted: predictSurvival(p)}));
  </script>

  <script id="21" type="text/markdown">
    ## 9. From a manual rule to machine learning
    We wrote the first rule ourselves. Now we will give the computer passenger examples and their real answers. The computer will try several rules and choose one that works well on those examples. This is called **supervised learning**: learning from examples that include answers.

    Our model is a **decision stump**. This is a small decision tree that asks just one yes/no question. For example: “Is the passenger in first class?” A yes sends the passenger to one group; a no sends them to the other group. Each group predicts whichever answer was more common in its learning examples.
    **Small made-up example:** if 7 of 10 people in the yes group survived, that group predicts survival. If 2 of 10 people in the no group survived, that group predicts non-survival. The program tries several questions and chooses the one with the fewest wrong answers in the training data.
    The result is a **model**: a learned rule we can reuse. This small model finds patterns; it does not know the full story of why each person survived or died.

    | Concept | In this experiment |
    |---|---|
    | Features | Details given to the model, such as `age = 29` and `pclass = 1` |
    | Label / target | The real answer: `survived = 1` or `survived = 0` |
    | Training | Learn from examples with answers, like studying practice questions |
    | Prediction | Use the learned rule to guess an answer without looking at it |
    | Testing | Try examples the training code did not use, then check the answers |
    | Overfitting | Fit the practice examples very closely but do poorly on new ones, like memorizing answers without learning a useful rule |

    **Before running:** will a learned rule necessarily beat our manual rule? What evidence would convince you?

    ### Prepare a reproducible split
    The helper below mixes up survivors and non-survivors separately. About 80% of each group becomes the **training set**: examples used to learn. The other 20% becomes the **test set**: examples used to check the learned rule.
    Think of 100 example cards: about 80 are for learning and 20 are for checking. Our real dataset is larger. A **seed** is a starting number for the shuffle; using `42` every time gives us the same split.
    In this simple model, unknown ages form a separate candidate group; age comparisons treat unknown age as “condition not met.” No missing age is converted to zero.
    **Teacher note:** the whole dataset was already visible during exploration. This split demonstrates the method; it is not a pristine, unseen final exam. For a formal assessment, reserve a hidden test set before exploration. People sharing families or tickets can also make random passenger splits less independent.
  </script>
  <script id="22" type="module" pinned>
    function splitPassengers(rows, seed = 42) {
      let state = seed >>> 0;
      const random = () => ((state = (1664525 * state + 1013904223) >>> 0) / 4294967296);
      const train = [], test = [];
      for (const outcome of [0, 1]) {
        const group = rows.filter(p => p.survived === outcome);
        for (let i = group.length - 1; i > 0; i--) {
          const j = Math.floor(random() * (i + 1));
          [group[i], group[j]] = [group[j], group[i]];
        }
        const cut = Math.floor(group.length * 0.8);
        train.push(...group.slice(0, cut));
        test.push(...group.slice(cut));
      }
      return {train, test};
    }
    const split = splitPassengers(passengers);
    display(Inputs.table([
      {portion: "Training", passengers: split.train.length},
      {portion: "Testing", passengers: split.test.length}
    ]));
  </script>
  <script id="23" type="text/markdown">
    ## 10. Train: let the examples choose the rule
    Run the helper cell, then the training cell. You do not need to memorize this code. Explain its four actions: **try a question → divide rows → predict the majority in each branch → count mistakes**.
    Candidate questions and the training table are shown so that learning is visible. Equal scores keep the earlier candidate; a tied branch predicts non-survival. This is a teaching implementation, not a full decision-tree library.
  </script>
  <script id="24" type="module" pinned>
    function majority(rows) {
      return rows.filter(p => p.survived === 1).length > rows.length / 2 ? 1 : 0;
    }
    function trainStump(training) {
      const candidates = [
        ...[1, 2, 3].map(value => ({question: `Ticket class = ${value}?`, matches: p => p.pclass === value})),
        ...[5, 10, 16, 18, 30, 50, 65].map(value => ({question: `Age known and < ${value}?`, matches: p => p.age != null && p.age < value})),
        {question: "Age unknown?", matches: p => p.age == null},
        {question: "Recorded sex = female?", matches: p => p.sex === "female"}
      ];
      const ranked = candidates.map(candidate => {
        const yes = training.filter(candidate.matches);
        const no = training.filter(p => !candidate.matches(p));
        const yesPrediction = majority(yes), noPrediction = majority(no);
        const predict = p => candidate.matches(p) ? yesPrediction : noPrediction;
        const mistakes = training.filter(p => predict(p) !== p.survived).length;
        return {...candidate, yesPrediction, noPrediction, predict, mistakes,
          yesCount: yes.length, noCount: no.length};
      }).filter(candidate => candidate.yesCount > 0 && candidate.noCount > 0)
        .sort((a, b) => a.mistakes - b.mistakes);
      return {model: ranked[0], ranked};
    }
  </script>
  <script id="25" type="module" pinned>
    const learned = trainStump(split.train);
    display(`Learned question: ${learned.model.question}`);
    display(`YES → predict ${learned.model.yesPrediction}; NO → predict ${learned.model.noPrediction} (1 = survives, 0 = does not survive).`);
    display(Inputs.table(learned.ranked.map(rule => ({
      question: rule.question, "training mistakes": rule.mistakes,
      "yes branch size": rule.yesCount, "no branch size": rule.noCount
    }))));
  </script>
  <script id="26" type="text/markdown">
    ## 11. Test: compare three approaches on the same people
    The baseline learns only the majority outcome in training. The manual rule stays fixed at first class OR age under 16. The stump chooses its question using training rows only.
    Compare all three on exactly the same test passengers. Do not compare test accuracy here directly with the earlier full-dataset accuracy: the passenger sets differ.
    **Accuracy:** out of all passengers, how many did we get right? Example: 80 correct out of 100 = `80%`.
    **Survivor recall:** out of the people who really survived, how many did we find? Example: we found 6 of 10 real survivors = `60%`.
    **Survivor precision:** out of the people we said would survive, how many really did? Example: 6 of our 8 survival predictions were right = `75%`.
    These are made-up examples to explain the scores. The table below shows our real results. A blank score means there were no people in the group we would divide by—for example, precision is blank when the rule predicts no survivors.
    **Student task:** name the best score, explain one mistake it hides, and state why you should not keep redesigning the model after looking at test results. Use a separate validation set for repeated design decisions.
  </script>
  <script id="27" type="module" pinned>
    function evaluateRule(name, rows, predict) {
      const tp = rows.filter(p => predict(p) === 1 && p.survived === 1).length;
      const tn = rows.filter(p => predict(p) === 0 && p.survived === 0).length;
      const fp = rows.filter(p => predict(p) === 1 && p.survived === 0).length;
      const fn = rows.filter(p => predict(p) === 0 && p.survived === 1).length;
      const percent = (a, b) => b ? +(100 * a / b).toFixed(2) : null;
      return {rule: name, passengers: rows.length, "accuracy (%)": percent(tp + tn, rows.length),
        "survivor recall (%)": percent(tp, tp + fn), "survivor precision (%)": percent(tp, tp + fp),
        "false positives": fp, "false negatives": fn};
    }
    const baselineOutcome = majority(split.train);
    const frozenManual = p => p.pclass === 1 || (p.age != null && p.age < 16) ? 1 : 0;
    const testScores = [
      evaluateRule("Training-majority baseline", split.test, () => baselineOutcome),
      evaluateRule("Manual rule (under 16)", split.test, frozenManual),
      evaluateRule("Learned stump", split.test, learned.model.predict)
    ];
    display(Inputs.table(testScores));
    display(Plot.barX(testScores, {y: "rule", x: "accuracy (%)", tip: true}).plot({
      x: {domain: [0, 100], grid: true}, marginLeft: 200, height: 220
    }));
    display(Inputs.table([
      evaluateRule("Stump: training", split.train, learned.model.predict),
      evaluateRule("Stump: test", split.test, learned.model.predict)
    ]));
  </script>
  <script id="35" type="text/markdown">
    ## Can we reach 90% accuracy?
    Yes—on the examples used for learning, a more detailed model can score over 90%. But the score on other passengers can be lower.
    A deeper tree asks several questions in a row. It can use class, sex, age, fare, and family counts together. The next experiment compares two fixed designs: a small tree (up to 4 questions along a path) and a deep tree (up to 12).
    Missing numeric inputs use the middle value from the **training rows only**. We exclude names, tickets, cabins, ports, destinations, survival, lifeboats, and body IDs from the prediction inputs.
    **Guess first:** will the deeper tree do better on both sets, or just on training?
  </script>
  <script id="36" type="module" pinned>
    import { trainTree } from "./ml.js";
    const smallTree = trainTree(split.train, {maxDepth: 4, minLeaf: 8});
    const deepTree = trainTree(split.train, {maxDepth: 12, minLeaf: 1});
    const treeScores = [
      evaluateRule("Small tree · training", split.train, smallTree.predict),
      evaluateRule("Small tree · test", split.test, smallTree.predict),
      evaluateRule("Deep tree · training", split.train, deepTree.predict),
      evaluateRule("Deep tree · test", split.test, deepTree.predict)
    ];
    display(Inputs.table(treeScores));
    display(Plot.barX(treeScores, {y: "rule", x: "accuracy (%)", fill: "rule", tip: true}).plot({
      marginLeft: 170, x: {domain: [0, 100], grid: true}, height: 240
    }));
  </script>
  <script id="37" type="text/markdown">
    ### A high score needs a label
    **Training score** asks “How well did the model learn the examples it studied?” **Test score** asks “How well does it work on examples the training code did not use?”
    The deep tree can fit small details in the training data. Some details do not help on other passengers. This is **overfitting**. A 90% training score does not promise 90% accuracy on new people.
    These are two planned classroom experiments, not a search for whichever test score looks best. Use validation data to choose model settings in a real project, then check a fresh test set once. Our class has already explored the full historical dataset, so these results remain a teaching demonstration.
    **Say it clearly:** “Our model got ___% on ___ passengers in the ___ set.” Never report an accuracy number without saying which set it describes.
  </script>
  <script id="44" type="text/markdown">
    ## Now use a real ML library on Titanic
    We installed **ml-cart**, a JavaScript library that builds decision trees. The full working example is below: load the data → split it → fill missing inputs → train → predict → check results.
    This cell runs on its own. It reads the CSV again and makes the same fixed 80/20 split; it does not rely on the earlier helper cells. The only local bridge imports the installed library.

    | Code name | Simple meaning |
    |---|---|
    | `Xtrain` | A list of input rows: class, sex, age, fare, siblings/spouse, parents/children |
    | `ytrain` | The correct survival answer for each training row |
    | `model.train(Xtrain, ytrain)` | Learn the tree from those examples |
    | `model.predict(Xtest)` | Predict the test answers without supplying their labels |
    | `accuracy` | Compare the predictions with the real answers after prediction |

    Example input: `[3, 1, 25, 15, 0, 0]` means third class, female, age 25, fare £15, no siblings/spouse, and no parents/children aboard. Here `0 = male` and `1 = female` are category codes, not scores.
    We set `maxDepth: 4` before checking results. Missing numeric values use medians from training rows only. `survived`, `boat`, and `body` never appear in an input row.
    The library may give different results from our hand-written tree because its split and stopping rules differ. We compare results without changing settings to chase a test score.
    Package reference: [ml-cart documentation](https://mljs.github.io/decision-tree-cart/).
  </script>
  <script id="45" type="module" pinned>
    import { DecisionTreeClassifier } from "./cart-library.js";

    const libraryRun = await (async () => {
      // 1. Load all passenger records. Blank values stay missing.
      const rows = await FileAttachment("assets/titanic.csv").csv({typed: true});

      // 2. Make a repeatable 80/20 split, keeping both outcomes in each set.
      let seed = 42;
      const random = () => ((seed = (1664525 * seed + 1013904223) >>> 0) / 4294967296);
      const train = [], test = [];
      for (const label of [0, 1]) {
        const group = rows.filter(p => p.survived === label);
        for (let i = group.length - 1; i > 0; i--) {
          const j = Math.floor(random() * (i + 1));
          [group[i], group[j]] = [group[j], group[i]];
        }
        const cut = Math.floor(group.length * 0.8);
        train.push(...group.slice(0, cut));
        test.push(...group.slice(cut));
      }

      // 3. Learn missing-value replacements from TRAINING rows only.
      const numericFields = ["pclass", "age", "fare", "sibsp", "parch"];
      const medians = Object.fromEntries(numericFields.map(field => {
        const values = train.map(p => p[field]).filter(v => v != null && Number.isFinite(v)).sort((a, b) => a - b);
        if (!values.length) throw new Error(`No known training values for ${field}`);
        return [field, (values[Math.floor((values.length - 1) / 2)] + values[Math.floor(values.length / 2)]) / 2];
      }));
      const number = (p, field) => p[field] == null ? medians[field] : p[field];
      const encode = p => [number(p, "pclass"), p.sex === "female" ? 1 : 0,
        number(p, "age"), number(p, "fare"), number(p, "sibsp"), number(p, "parch")];
      const Xtrain = train.map(encode);
      const ytrain = train.map(p => p.survived);
      const Xtest = test.map(encode);
      const ytest = test.map(p => p.survived);

      // 4. Train the library model. It never receives test answers here.
      const model = new DecisionTreeClassifier({gainFunction: "gini", maxDepth: 4, minNumSamples: 8});
      model.train(Xtrain, ytrain);

      // 5. Make predictions, then compare them with the real answers.
      const predictedTrain = model.predict(Xtrain);
      const predictedTest = model.predict(Xtest);
      const score = (set, actual, predicted) => {
        const correct = actual.filter((answer, i) => answer === predicted[i]).length;
        const falsePositives = actual.filter((answer, i) => answer === 0 && predicted[i] === 1).length;
        const falseNegatives = actual.filter((answer, i) => answer === 1 && predicted[i] === 0).length;
        return {set, passengers: actual.length, correct,
          "accuracy (%)": +(100 * correct / actual.length).toFixed(2),
          "false positives": falsePositives, "false negatives": falseNegatives};
      };
      return {model, encode, train, test,
        scores: [score("Training", ytrain, predictedTrain), score("Test", ytest, predictedTest)],
        examples: test.map((p, i) => ({name: p.name, age: p.age, pclass: p.pclass,
          actual: p.survived, predicted: predictedTest[i], correct: p.survived === predictedTest[i]}))};
    })();

    // 6. Show the measured results, not a promised accuracy number.
    display(Inputs.table(libraryRun.scores));
    display(Plot.barX(libraryRun.scores, {y: "set", x: "accuracy (%)", fill: "set", tip: true})
      .plot({x: {domain: [0, 100], grid: true}, height: 170, marginLeft: 75}));
    display(Inputs.table(libraryRun.examples, {columns: ["name", "age", "pclass", "actual", "predicted", "correct"]}));
  </script>

  <script id="28" type="text/markdown">
    ## 12. Use the model in a web interface
    Training chooses the rule. **Inference** means using the rule to make a new prediction. It does not mean training again.
    Our form compares the **ml-cart library model** with our **hand-written small tree**. Enter class, age, sex, fare, and family counts. Each model returns `1` or `0`. Neither gets to see a real survival answer.
    Change the inputs and read the path. A small change may leave the prediction unchanged because the passenger still follows the same branches. The displayed result is a class prediction, not a personal survival probability.
  </script>

  <script id="31" type="text/markdown">
    ### Reflect before presenting
    The model summarizes historical associations; it does not establish causes or anyone's value. A learned rule can reproduce historical inequality. A strong overall score can also hide differences between groups.
    **Team deliverable:** a short demonstration with one chart, your written hypothesis, the learned rule, test metrics, one mistaken prediction, and a visitor-facing explanation of a limitation.
    **Exit questions:** What did the model learn? Which data did it learn from? Why exclude lifeboats? Why is training accuracy insufficient? Which extra evidence would you want before trusting it beyond this lesson?

    ## Learning-plan board · two sessions, 60 minutes each
    Use this board to lead the class. Finish a stage when students can show the evidence in the final column. The optional extension is outside the two-session schedule.

    | Stage | Time | Student activity | Knowledge goal | Evidence of learning |
    |---|---|---|---|---|
    | Session 1 · Read the records | 10 min | Explain fields and inspect the whole table | Rows, fields, types, features, target, missing data | Correctly classify three inputs and two excluded outcome fields |
    | Ask and filter | 10 min | Predict which group might survive more; filter first class | Testable hypotheses and subsets | A prediction written before checking results |
    | Group and visualize | 15 min | Group by class/sex/port; compare age bands | Counts, rates, association versus causation | One chart explained with group size and percentage |
    | Write a manual rule | 10 min | Explain OR; try the starting rule | Explicit decision rules and boundary cases | Correctly predict three example profiles |
    | Measure and inspect mistakes | 15 min | Compare with baseline; find both error types | Accuracy, false positives, false negatives | A result plus two counterexamples |
    | Session 2 · Explain learning | 10 min | Play the 10-passenger animation; count each branch's votes | Supervised learning, labels, one-question trees | Explain why one candidate question wins |
    | Separate the data | 10 min | Run the repeatable split and inspect its sizes | Test sets, leakage, independent evaluation | Explain why test labels cannot choose the rule |
    | Train a small model | 15 min | Follow the full ml-cart example from inputs to predictions | Training code, feature rows, library models | Point to the inputs, labels, train call, and predict call |
    | Evaluate fairly | 10 min | Compare three methods on the same test rows | Precision, recall, generalization | A comparison that names the evaluation set and a limitation |
    | Build understanding in the web UI | 10 min | Change visitor inputs; explain each prediction | Inference, input handling, user communication | A working form and a clear explanation |
    | Present and reflect | 5 min | Share a finding and answer an exit question | Evidence-based claims and model limits | One supported claim and one unanswered question |
    | Optional extension | 30+ min | Design a deeper tree or add fare/family features; use validation data | Model complexity, overfitting, feature engineering | Compare training and validation errors before opening a fresh test set |

    **Assessment:** reward explanations, fair comparisons, and honest treatment of mistakes. A higher accuracy score alone is not the learning goal.
