  <script id="20" type="text/markdown">
    ### What do the fields mean?

    A **field** is a column in the table, such as `age`. A **value** is what you find in one cell, such as `29`.

    A **feature** is a detail we give to the model to help it make a guess. The **target** is the answer we want it to guess: `survived`.

    Use this table as a reference. You do not need to read every row now.

    | Field | Simple meaning | Example value and what it means | Use in our lesson |
    |---|---|---|---|
    | `pclass` | The passenger's ticket class | `1` = first class; `2` = second class; `3` = third class | Compare the three groups; use as a model input |
    | `survived` | Whether the passenger survived the sinking | `1` = survived; `0` = did not survive | The answer we check our predictions against; do not give it to the model as an input |
    | `name` | The passenger's name, as written in the record | `Allen, Miss. Elisabeth Walton` = Elisabeth Walton Allen | Find a person in the table; we do not use names to train this model |
    | `sex` | The sex recorded for the passenger | `female` or `male` | Compare groups; use as a model input |
    | `age` | How old the passenger was, in years | `29` = 29 years old; `0.92` = about 11 months old | Compare age groups; use as a model input. A blank means the age is unknown |
    | `sibsp` | How many brothers, sisters, husbands, or wives the passenger had on the ship | `0` = none recorded; `1` = one sibling or spouse. It does not tell us which one | Explore family size. Do not count the passenger themselves |
    | `parch` | How many parents or children the passenger had on the ship | `2` = two parents or children in total; for a baby, this can mean both parents | Explore family size. It does not count siblings or spouses |
    | `ticket` | The code or number on the ticket | `113781` = a ticket identifier shared by several Allison family records | Connect people with the same ticket. A larger ticket number does not mean a better ticket |
    | `fare` | The ticket price recorded in British pounds | `151.5500` = a recorded fare of £151.55 | Compare recorded prices. People sharing a ticket can have the same fare value |
    | `cabin` | The room number or room numbers in the record | `B5` = cabin B5; `C22 C26` lists two cabins | Explore cabin information. Many rows have no cabin value |
    | `embarked` | The port where the passenger got on the ship | `S` = Southampton; `C` = Cherbourg; `Q` = Queenstown | Compare passengers who boarded at different ports |
    | `boat` | The lifeboat number or code in the record | `2` = lifeboat 2; `11` = lifeboat 11 | Do not use it to predict: this detail comes from the rescue, after the sinking began |
    | `body` | The identification number given to a recovered body | `135` = body identification number 135. It is not a count or an age. A blank means no body ID is recorded | Do not use it to predict: it gives information learned after the disaster |
    | `home.dest` | The person's recorded home or travel destination | `St Louis, MO` = St Louis, Missouri; `Montreal, PQ / Chesterville, ON` lists two places | Read more about a passenger's journey; not an input in our small model |

    ### Read one real passenger row

    Elisabeth Walton Allen has `pclass = 1`, `age = 29`, `sibsp = 0`, `parch = 0`, and `survived = 1`.

    In plain English: she was 29, travelled in first class, and survived. This table lists no siblings, spouse, parents, or children travelling with her. That does **not** prove she travelled without friends or other people she knew.

    ### Three details that are easy to misunderstand

    - **Blank is not zero.** A blank age means “we do not know.” `sibsp = 0` means no siblings or spouse are recorded on the ship.
    - **A number can be a label.** Ticket `113781` identifies a ticket. Adding ticket numbers together would not tell us anything useful about passengers.
    - **Some fields already reveal the answer.** Imagine predicting a test score while looking at the answer sheet. Using `survived`, `boat`, or `body` as prediction inputs creates a similar problem.

    This is a historical dataset for learning. It does not include the ship's crew. Some ages are estimates, and the list may differ from newer historical research.

  <script id="5" type="text/markdown" data-chapter="Find patterns">
    ## Group fields to find patterns

    Group passengers by one field, count the people, and count the survivors.

    **Why a rate?** A larger group can have more survivors simply because it has more people. For example, 30 survivors out of 100 people is 30%; 20 out of 40 is 50%. The group with fewer survivors has the higher survival rate.

    Change **Group by** and compare both the counts and the percentages. Try every field in the list.

    **Be careful with “why”.** If two things appear together in the data, that does not prove one caused the other. A higher survival rate in one ticket class does not, by itself, explain why those passengers survived.
  </script>
  <script id="6" type="module" pinned>
    function summarize(rows, key) {
      return Array.from(d3.group(rows, key), ([group, members]) => {
        const survivors = d3.sum(members, p => p.survived);
        return {group, passengers: members.length, survivors,
          "survival (%)": Math.round(1000 * survivors / members.length) / 10};
      });
    }
    const groupField = view(Inputs.select(["pclass", "sex", "embarked"], {label: "Group by", value: "pclass"}));
  </script>

  <script id="12" type="module" pinned data-open>
    // Describe your rule in words. Update this sentence when you change the rule.
    const ruleName = `First class OR younger than ${ruleCutoff}`;

    function predictSurvival(p) {
      const firstClass = p.pclass === 1;

    ## First, watch a tree learn from just 10 examples

    Before we use the Titanic data, start with a tiny array. These **10 passengers are made up** so we can follow every step. The answers are also made up; they are not historical claims.

    A **decision stump** is a tree with one yes/no question. We will try two questions: “Is the passenger in first class?” and “Is the passenger younger than 16?”

    **Watch → guess → step forward.** At each split, count the `1` and `0` answers in both groups. The most common answer becomes that group's prediction.
  </script>

  <script id="21" type="text/markdown">
    ## From a manual rule to machine learning

    You wrote the first rule yourself. Now we give the computer passenger examples **with their real answers**. The computer tries several questions and keeps the one that makes the fewest mistakes on those examples. This is called **supervised learning**: learning from examples that include answers.

    The result is a **model**: a learned rule we can reuse. A model finds patterns; it does not know the full story of why each person survived or died.

    | Concept | In this experiment |
    |---|---|
    | Features | Details given to the model, such as `age = 29` and `pclass = 1` |
    | Label / target | The real answer: `survived = 1` or `survived = 0` |
    | Training | Learn from examples with answers, like studying practice questions |
    | Prediction | Use the learned rule to guess an answer without looking at it |
    | Testing | Try examples the training code did not use, then check the answers |

    ### Split the data the same way each time

    Think of 100 example cards: about 80 are for learning and 20 are for checking. The **training set** is the examples used to learn. The **test set** is the examples used to check the learned rule.

    The helper below shuffles survivors and non-survivors separately, so both sets keep the same mix. A **seed** is the starting number for the shuffle; using `42` every time gives the same split.

    **Keep your test fair.** You have already explored the full table, so this is practice at splitting data, not a perfectly fresh test. In a new project, put the test records aside before you explore.
  </script>
  <script id="22" type="module" pinned>
    function splitPassengers(rows, seed = 42) {
      let state = seed >>> 0;
      const random = () => ((state = (1664525 * state + 1013904223) >>> 0) / 4294967296);
      const train = [], test = [];
      for (const outcome of [0, 1]) {
        const group = rows.filter(p => p.survived === outcome);
        for (let i = group.length - 1; i > 0; i--) {
          const j = Math.floor(random() * (i + 1));
          [group[i], group[j]] = [group[j], group[i]];
        }
        const cut = Math.floor(group.length * 0.8);
        train.push(...group.slice(0, cut));
        test.push(...group.slice(cut));
      }
      return {train, test};
    }
    const split = splitPassengers(passengers);
    display(Inputs.table([
      {portion: "Training", passengers: split.train.length},
      {portion: "Testing", passengers: split.test.length}
    ]));
  </script>
  <script id="23" type="text/markdown">
    ## Train: let the examples choose the rule

    The next cell is the learning code. You do not need to memorize it. Its four actions are: **try a question → divide the rows → predict the majority in each group → count the mistakes**.

    The candidate questions are about ticket class, age, unknown age, and recorded sex. If two questions make the same number of mistakes, the code keeps the earlier one. If a group has equal numbers of survivors and non-survivors, it predicts `0`.
  </script>
  <script id="24" type="module" pinned>
    function majority(rows) {
      return rows.filter(p => p.survived === 1).length > rows.length / 2 ? 1 : 0;
    }
    function trainStump(training) {
      const candidates = [
        ...[1, 2, 3].map(value => ({question: `Ticket class = ${value}?`, matches: p => p.pclass === value})),
        ...[5, 10, 16, 18, 30, 50, 65].map(value => ({question: `Age known and < ${value}?`, matches: p => p.age != null && p.age < value})),
        {question: "Age unknown?", matches: p => p.age == null},
        {question: "Recorded sex = female?", matches: p => p.sex === "female"}
      ];
      const ranked = candidates.map(candidate => {
        const yes = training.filter(candidate.matches);
        const no = training.filter(p => !candidate.matches(p));
        const yesPrediction = majority(yes), noPrediction = majority(no);
        const predict = p => candidate.matches(p) ? yesPrediction : noPrediction;
        const mistakes = training.filter(p => predict(p) !== p.survived).length;
        return {...candidate, yesPrediction, noPrediction, predict, mistakes,
          yesCount: yes.length, noCount: no.length};
      }).filter(candidate => candidate.yesCount > 0 && candidate.noCount > 0)
        .sort((a, b) => a.mistakes - b.mistakes);
      return {model: ranked[0], ranked};
    }
  </script>
  <script id="25" type="module" pinned data-guess="Which question will the computer choose: one about ticket class, about age, or about sex?">
    const learned = trainStump(split.train);
    display(`Learned question: ${learned.model.question}`);
    display(`YES → predict ${learned.model.yesPrediction}; NO → predict ${learned.model.noPrediction} (1 = survives, 0 = does not survive).`);
    display(Inputs.table(learned.ranked.map(rule => ({
      question: rule.question, "training mistakes": rule.mistakes,
      "yes group size": rule.yesCount, "no group size": rule.noCount
    }))));
  </script>

  <script id="27" type="module" pinned>
    function evaluateRule(name, rows, predict) {
      const correct = rows.filter(p => predict(p) === p.survived).length;
      const falsePositives = rows.filter(p => predict(p) === 1 && p.survived === 0).length;
      const falseNegatives = rows.filter(p => predict(p) === 0 && p.survived === 1).length;
      return {rule: name, passengers: rows.length, correct,
        "accuracy (%)": +(100 * correct / rows.length).toFixed(2),
        "false positives": falsePositives, "false negatives": falseNegatives};
    }
    const baselineOutcome = majority(split.train);
    const testScores = [
      evaluateRule("Baseline (majority guess)", split.test, () => baselineOutcome),
      evaluateRule("Your rule", split.test, predictSurvival),
      evaluateRule("One learned question", split.test, learned.model.predict)
    ];
    display(`Your rule: ${ruleName}. Learned question: ${learned.model.question}`);
    display(Inputs.table(testScores));
    display(Plot.barX(testScores, {y: "rule", x: "accuracy (%)", tip: true}).plot({
      x: {domain: [0, 100], grid: true}, y: {domain: testScores.map(d => d.rule), label: null},
      marginLeft: 170, height: 200
    }));
    display(Inputs.table([
      evaluateRule("Learned question · training", split.train, learned.model.predict),
      evaluateRule("Learned question · test", split.test, learned.model.predict)
    ]));
  </script>

  <script id="35" type="text/markdown" data-chapter="Grow a tree">
    ## Grow a tree: ask more than one question

    One question already does well. A **decision tree** asks several questions in a row. After “Is the passenger female?”, it can ask a different next question inside each group.

    Our trees may use six inputs: ticket class, sex, age, fare, siblings or spouse aboard, and parents or children aboard. Names, tickets, cabins, ports, and destinations are left out. So are `survived`, `boat`, and `body`, because they reveal the answer.

    A blank age or fare is replaced by the middle value of the **training rows only**.

    We compare two trees: a **small tree** (up to 4 questions in a row) and a **deep tree** (up to 12).
  </script>
  <script id="36" type="module" pinned data-guess="Will the deep tree beat the small tree on training passengers, on test passengers, on both, or on neither?">

    const deepTree = trainTree(split.train, {maxDepth: 12, minLeaf: 1});
    const treeScores = [
      evaluateRule("Small tree · training", split.train, smallTree.predict),
      evaluateRule("Small tree · test", split.test, smallTree.predict),
      evaluateRule("Deep tree · training", split.train, deepTree.predict),
      evaluateRule("Deep tree · test", split.test, deepTree.predict)
    ];
    display(Inputs.table(treeScores));
    display(Plot.barX(treeScores, {y: "rule", x: "accuracy (%)", fill: "rule", tip: true}).plot({
      x: {domain: [0, 100], grid: true}, y: {domain: treeScores.map(d => d.rule), label: null},
      marginLeft: 170, height: 240
    }));
  </script>
  <script id="64" type="text/markdown">
    ### Watch the gap open

    The next chart trains twelve trees, from 1 question deep to 12 questions deep. It scores each tree twice: on its training passengers and on the test passengers.

    Move the slider to read both scores at any depth.
  </script>
  <script id="65" type="module" pinned>

    const depthScores = d3.range(1, 13).flatMap(maxDepth => {

      const accuracy = rows => +(100 * rows.filter(p => tree.predict(p) === p.survived).length / rows.length).toFixed(1);

  <script id="37" type="text/markdown">
    ### A high score needs a label

    The training line keeps climbing: a deeper tree fits its own examples better and better. The test line does not follow it. After a few questions it stops improving, and then it drifts down.

    The deep tree has fitted small details of its training passengers that do not help with other passengers. This is **overfitting**. Its sign is a **large gap between the training score and the test score**.

  <script id="44" type="text/markdown">
    ## Use a real machine-learning library

    You have seen how a tree learns. You do not need to write the learning code yourself: programmers share it as a **library**. We use **ml-cart**, a JavaScript library for decision trees.

    Almost every machine-learning library is used in the same five steps:

    | Step | In the code | Meaning |
    |---|---|---|
    | 1. Prepare | `medians`, `encode` | Fill blanks and turn each passenger into a row of numbers |
    | 2. Separate | `Xtrain`, `ytrain`, `Xtest`, `ytest` | `X` holds the input rows; `y` holds the answers |
    | 3. Train | `libraryModel.train(Xtrain, ytrain)` | Learn a tree from the training inputs and answers |
    | 4. Predict | `libraryModel.predict(Xtest)` | Predict from the test inputs only |
    | 5. Check | compare with `ytest` | Count how many predictions match the real answers |

    Example input row: `[3, 1, 25, 15, 0, 0]` means third class, female, age 25, fare £15, no siblings or spouse, and no parents or children aboard. `1 = female` and `0 = male` are codes, not scores.

    The first cell does steps 1 and 2.
  </script>
  <script id="71" type="module" pinned data-open>
    // 1. Fill blanks with the middle value (the median) of the TRAINING rows only.
    const numericFields = ["pclass", "age", "fare", "sibsp", "parch"];
    const medians = Object.fromEntries(numericFields.map(field => [field, d3.median(split.train, p => p[field])]));

    // 2. Turn each passenger into a row of six numbers. The answer is NOT in the row.
    //    a ?? b means: use a, but if a is missing, use b.
    const encode = p => [
      p.pclass ?? medians.pclass,
      p.sex === "female" ? 1 : 0,
      p.age ?? medians.age,
      p.fare ?? medians.fare,
      p.sibsp ?? medians.sibsp,
      p.parch ?? medians.parch
    ];
    const Xtrain = split.train.map(encode);
    const ytrain = split.train.map(p => p.survived);
    const Xtest = split.test.map(encode);
    const ytest = split.test.map(p => p.survived);

    display(Inputs.table(split.train.slice(0, 5).map((p, i) => ({
      passenger: p.name, "input row (X)": Xtrain[i].join(", "), "answer (y)": ytrain[i]
    }))));
  </script>
  <script id="72" type="text/markdown">
    The second cell does steps 3, 4, and 5. `maxDepth: 4` allows up to 4 questions in a row. `minNumSamples: 8` stops dividing a group once it has 8 passengers or fewer. We chose these settings before looking at the results.
  </script>
  <script id="45" type="module" pinned data-open data-guess="How many of the 262 test passengers will the library tree get right, using six inputs? Look back at the score for one learned question.">
    import { DecisionTreeClassifier } from "./cart-library.js";

    // 3. Train. The model sees the training inputs and the training answers.
    const libraryModel = new DecisionTreeClassifier({maxDepth: 4, minNumSamples: 8});
    libraryModel.train(Xtrain, ytrain);

    // 4. Predict. The model gets inputs only, never the answers.
    const predictedTest = libraryModel.predict(Xtest);
    const libraryPredict = p => libraryModel.predict([encode(p)])[0];

    // 5. Check: compare each prediction with the real answer.
    display(Inputs.table([
      evaluateRule("Library tree · training", split.train, libraryPredict),
      evaluateRule("Library tree · test", split.test, libraryPredict)
    ]));
    display(Inputs.table(split.test.map((p, i) => ({
      name: p.name, sex: p.sex, age: p.age, pclass: p.pclass,
      actual: ytest[i], predicted: predictedTest[i], correct: ytest[i] === predictedTest[i]
    }))));
  </script>

  <script id="88" type="text/markdown">
    ## Going further (optional)

    Read this if you finish early. You do not need it for the rest of the lesson.

    **Precision and recall.** Accuracy counts all correct answers together. Two other scores look only at survivors. *Recall*: of the people who really survived, how many did the model find? *Precision*: of the people the model said would survive, how many really did? You can calculate both from the false positives and false negatives in the tables.

    **How a library chooses a question.** Our small examples counted mistakes. ml-cart uses *Gini impurity*: a number that measures how mixed the `1` and `0` answers are inside a group. It picks the question that leaves the two groups least mixed.

    **Validation set.** We chose `maxDepth: 4` before looking at the test results. To try many settings fairly, use a third group of records, called a *validation set*, to choose between them. Save the test set for one final check.

    **Families.** Passengers on the same ticket often share an outcome. Some families have members in both the training set and the test set. This makes our test a little easier than a test on completely new people.

    **Challenge.** In **Grow a tree**, open the library cell and change `maxDepth: 4` to `3`, then to `8`. Press **Run** each time and come back to the table at the top of this chapter. Which setting scores best? Why should you not choose a setting this way in a real project? Press **↺ Reset** when you finish.
  </script>

    ### Words we used

    | Word | Meaning |
    |---|---|
    | Field | A column in the table, such as `age` |
    | Feature (input) | A detail we give to the model |
    | Target (label) | The answer we want to predict: `survived` |
    | Prediction | A guess made by a rule or a model |
    | Baseline | The simplest guess, used for comparison |
    | Accuracy | Correct predictions divided by all predictions |
    | False positive | Predicted survival, but the person died |
    | False negative | Predicted non-survival, but the person survived |
    | Model | A rule learned from examples |
    | Training set | The examples the model learns from |
    | Test set | Examples kept aside to check the model |
    | Decision tree | A model that asks yes/no questions in a row |
    | Decision stump | A tree with only one question |
    | Overfitting | Fitting the training examples closely but doing worse on new ones |
    | Seed | The starting number for a shuffle; the same seed gives the same shuffle |
    | Inference | Using a trained model to make a new prediction |
    | Data leakage | Giving the model an input that reveals the answer |
