# Builds the Titanic lesson and publishes it as a web page that students open
# without any setup. One-time step in the repository on GitHub:
# Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Publish lesson to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: titanic-js/package-lock.json
      - run: npm ci
        working-directory: titanic-js
      - run: npm run build
        working-directory: titanic-js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: titanic-js/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
